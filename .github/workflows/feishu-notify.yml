name: 飞书通知

on:
  push:
    branches:
      - master
      - main
  release:
    types:
      - published
      - edited

jobs:
  feishu-notify:
    runs-on: ubuntu-latest
    steps:
      - name: 发送飞书通知
        uses: actions/github-script@v7
        with:
          script: |
            const webhook = '${{ secrets.FEISHU_WEBHOOK }}';
            const repo = context.payload.repository?.full_name || 'LZXdywtgtd/PE-MMNet-v4';
            const repoUrl = `https://github.com/${repo}`;

            let title = '';
            let content = '';
            let color = '#3498db';

            // 判断触发类型
            if (context.eventName === 'release') {
              const tag = context.payload.release?.tag_name || '';
              const releaseName = context.payload.release?.name || tag;
              const body = context.payload.release?.body || '';
              const isPrerelease = context.payload.release?.prerelease || false;

              title = `🚀 ${isPrerelease ? '预发布' : '正式发布'} v${tag.replace('v', '')}`;
              content = `**${releaseName}**\n\n${body.substring(0, 500)}${body.length > 500 ? '...' : ''}`;
              color = isPrerelease ? '#f39c12' : '#27ae60';
            } else {
              // ====== Push 事件 ======
              const commitMsg = context.payload.commits?.[0]?.message || '代码更新';
              const commitSha = context.sha.substring(0, 7);
              const author = context.payload.commits?.[0]?.author?.name || 'Unknown';
              const branch = context.ref.replace('refs/heads/', '');

              // 1. 拆分标题和正文
              const lines = commitMsg.split('\n');
              const subject = lines[0];
              let body = lines.slice(1).join('\n').trim();

              // 2. 截断正文（飞书卡片限制，保留前 1500 字符）
              const MAX_BODY_LEN = 1500;
              let bodyDisplay = '';
              if (body) {
                bodyDisplay = body.length > MAX_BODY_LEN
                  ? body.substring(0, MAX_BODY_LEN) + '\n\n... (内容已截断，请查看 GitHub 完整提交)'
                  : body;
                // 用 Markdown 代码块包裹，保留缩进和标题格式
                bodyDisplay = `\n\n📝 **详细变更:**\n\`\`\`\n${bodyDisplay}\n\`\`\``;
              }

              // 3. 组装完整内容
              title = `📝 代码更新 - ${branch}`;
              content = `**${subject}**\n\n` +
                        `📌 提交: \`${commitSha}\`\n` +
                        `👤 作者: ${author}\n` +
                        `🌿 分支: ${branch}` +
                        bodyDisplay;
              color = '#3498db';
            }

            // 构建卡片消息
            const card = {
              msg_type: "interactive",
              card: {
                schema: "2.0",
                config: {
                  update_multi: true
                },
                header: {
                  title: {
                    tag: "plain_text",
                    content: title
                  },
                  template: "blue"
                },
                body: {
                  direction: "vertical",
                  padding: "12px 12px 12px 12px",
                  elements: [
                    {
                      tag: "markdown",
                      content: content
                    },
                    {
                      tag: "hr"
                    },
                    {
                      tag: "div",
                      text: {
                        tag: "lark_md",
                        content: `📦 **PE-MMNet-v4** | [查看代码](${repoUrl}) | [Releases](${repoUrl}/releases)`
                      }
                    }
                  ]
                }
              }
            };

            // 发送请求
            const payload = JSON.stringify(card);
            const response = await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: payload
            });

            if (!response.ok) {
              console.error('飞书通知发送失败:', await response.text());
              core.setFailed('飞书通知发送失败');
            } else {
              console.log('飞书通知发送成功');
            }
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
